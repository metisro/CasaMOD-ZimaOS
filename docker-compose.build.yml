name: zimamod
version: "1.1.35-local"

services:
  zimamod-api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        VERSION: "1.1.35-local"
    image: zimamod-api:local
    container_name: zimamod-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      BING_GALLERY_DIR: /gallery
      HOST_PROC_DIR: /host/proc
      HOST_SYS_DIR: /host/sys
      ZIMAMOD_API_PORT: "8090"
    volumes:
      - type: bind
        source: /DATA/AppData/zimamod
        target: /data
      - type: bind
        source: /DATA/Gallery/Bing Wallpapers
        target: /gallery
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true

  zimamod-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
      args:
        VERSION: "1.1.35-local"
    image: zimamod-proxy:local
    container_name: zimamod-proxy
    labels:
      icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zimamod-api
    environment:
      ZIMAMOD_DASHBOARD_PORT: "8088"
      ZIMAMOD_API_PORT: "8090"
    volumes:
      - type: bind
        source: /DATA/AppData/zimamod/mod
        target: /mods
        read_only: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zimamod-proxy
  author: metisro
  developer: metisro
  category: Utilities
  icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
  index: /
  port_map: "8088"
  scheme: http
  store_app_id: zimamod
  title:
    en_us: ZimaMOD
  tagline:
    en_us: Independent mod framework for ZimaOS
  description:
    en_us: Extend the ZimaOS dashboard with independently installed JavaScript and CSS mods.
  version: "1.1.35-local"
  updateAt: "2026-06-25"
  releaseNotes:
    en_us: Local development build.
  repo: https://github.com/metisro/ZimaMOD
  support: https://github.com/metisro/ZimaMOD/issues
