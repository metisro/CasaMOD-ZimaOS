services:
  casamod-zimaos-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: casamod-zimaos-api:local
    container_name: casamod-zimaos-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8090"
    volumes:
      - /DATA/AppData/casamod:/data

  casamod-zimaos-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    image: casamod-zimaos-proxy:local
    container_name: casamod-zimaos-proxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - casamod-zimaos-api
    volumes:
      - /DATA/AppData/casamod/mod:/mods:ro
