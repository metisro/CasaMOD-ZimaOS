name: zimamod

services:
  zimamod-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: zimamod-api:local
    container_name: zimamod-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8090"
    volumes:
      - /DATA/AppData/zimamod:/data

  zimamod-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    image: zimamod-proxy:local
    container_name: zimamod-proxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zimamod-api
    volumes:
      - /DATA/AppData/zimamod/mod:/mods:ro
