name: zimamod
version: "1.1.34"

services:
  zimamod-api:
    image: ghcr.io/metisro/zimamod-api:1.1.34
    container_name: zimamod-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      BING_GALLERY_DIR: /gallery
      HOST_PROC_DIR: /host/proc
      HOST_SYS_DIR: /host/sys
      ZIMAMOD_API_PORT: "8090"
    volumes:
      - type: bind
        source: /DATA/AppData/zimamod
        target: /data
      - type: bind
        source: /DATA/Gallery/Bing Wallpapers
        target: /gallery
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true

  zimamod-proxy:
    image: ghcr.io/metisro/zimamod-proxy:1.1.34
    container_name: zimamod-proxy
    labels:
      icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zimamod-api
    environment:
      ZIMAMOD_DASHBOARD_PORT: "8088"
      ZIMAMOD_API_PORT: "8090"
    volumes:
      - type: bind
        source: /DATA/AppData/zimamod/mod
        target: /mods
        read_only: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zimamod-proxy
  author: metisro
  developer: metisro
  category: Utilities
  icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
  index: /
  port_map: "8088"
  scheme: http
  store_app_id: zimamod
  title:
    en_us: ZimaMOD
  tagline:
    en_us: Independent mod framework for ZimaOS
  description:
    en_us: Extend the ZimaOS dashboard with independently installed JavaScript and CSS mods.
  version: "1.1.34"
  updateAt: "2026-06-22"
  releaseNotes:
    en_us: '### Fixed: Dashboard Themes App Menu Positioning  This release fixes a Dashboard Themes regression where the native ZimaOS app-card dropdown could be positioned from the wrong place after opening the three-dot menu.    ### What Changed    - Dashboard Themes now preserves the native app blur layer and applies theme styling to that layer instead of removing it.  - Dropdown, menu, popover, and listbox elements keep their native positioning behavior while still receiving a higher z-index.  - Liquid Glass dashboard app-card overlays now target the preserved blur layer.    ### Validation    - Added deployment coverage to prevent reintroducing forced dropdown positioning.  - Verified full test suite: 10/10 passing.'
  repo: https://github.com/metisro/ZimaMOD
  support: https://github.com/metisro/ZimaMOD/issues
