name: zimamod

services:
  zimamod-api:
    image: ghcr.io/metisro/zimamod-api:latest
    container_name: zimamod-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8090"
    volumes:
      - /DATA/AppData/zimamod:/data

  zimamod-proxy:
    image: ghcr.io/metisro/zimamod-proxy:latest
    container_name: zimamod-proxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zimamod-api
    volumes:
      - /DATA/AppData/zimamod/mod:/mods:ro
