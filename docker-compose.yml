name: zimamod
version: "1.1.21"

services:
  zimamod-api:
    image: ghcr.io/metisro/zimamod-api:1.1.21
    container_name: zimamod-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      ZIMAMOD_API_PORT: "${ZIMAMOD_API_PORT:-8090}"
    volumes:
      - /DATA/AppData/zimamod:/data

  zimamod-proxy:
    image: ghcr.io/metisro/zimamod-proxy:1.1.21
    container_name: zimamod-proxy
    labels:
      icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zimamod-api
    environment:
      ZIMAMOD_DASHBOARD_PORT: "${ZIMAMOD_DASHBOARD_PORT:-8088}"
      ZIMAMOD_API_PORT: "${ZIMAMOD_API_PORT:-8090}"
    volumes:
      - /DATA/AppData/zimamod/mod:/mods:ro

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zimamod-proxy
  author: metisro
  developer: metisro
  category: Utilities
  icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
  index: /
  port_map: "${ZIMAMOD_DASHBOARD_PORT:-8088}"
  scheme: http
  store_app_id: zimamod
  title:
    en_us: ZimaMOD
  tagline:
    en_us: Independent mod framework for ZimaOS
  description:
    en_us: Extend the ZimaOS dashboard with independently installed JavaScript and CSS mods.
  version: "1.1.21"
  updateAt: "2026-06-10"
  releaseNotes:
    en_us: Fixes Copy key with ZimaOS session validation and adds a key icon.
  repo: https://github.com/metisro/ZimaMOD
  support: https://github.com/metisro/ZimaMOD/issues
