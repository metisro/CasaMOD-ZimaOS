name: zimamod
version: "1.1.5"

services:
  zimamod-api:
    image: ghcr.io/metisro/zimamod-api:1.1.5
    container_name: zimamod-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8090"
    volumes:
      - /DATA/AppData/zimamod:/data

  zimamod-proxy:
    image: ghcr.io/metisro/zimamod-proxy:1.1.5
    container_name: zimamod-proxy
    labels:
      icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zimamod-api
    volumes:
      - /DATA/AppData/zimamod/mod:/mods:ro
      - /DATA/AppData/zimamod/store:/store:ro

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zimamod-proxy
  author: metisro
  developer: metisro
  category: Utilities
  icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
  index: /
  port_map: "8088"
  scheme: http
  store_app_id: zimamod
  title:
    en_us: ZimaMOD
  tagline:
    en_us: Independent mod framework for ZimaOS
  description:
    en_us: Extend the ZimaOS dashboard with independently installed JavaScript and CSS mods.
  version: "1.1.5"
  updateAt: "2026-06-08"
  releaseNotes:
    en_us: Exposes the MOD Store from the console and improves ZimaOS tile detection.
  repo: https://github.com/metisro/ZimaMOD
  support: https://github.com/metisro/ZimaMOD/issues
