name: zimamod
version: "1.1.33"

services:
  zimamod-api:
    image: ghcr.io/metisro/zimamod-api:1.1.33
    container_name: zimamod-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      BING_GALLERY_DIR: /gallery
      ZIMAMOD_API_PORT: "8090"
    volumes:
      - /DATA/AppData/zimamod:/data
      - /DATA/Gallery/Bing Wallpapers:/gallery

  zimamod-proxy:
    image: ghcr.io/metisro/zimamod-proxy:1.1.33
    container_name: zimamod-proxy
    labels:
      icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zimamod-api
    environment:
      ZIMAMOD_DASHBOARD_PORT: "8088"
      ZIMAMOD_API_PORT: "8090"
    volumes:
      - /DATA/AppData/zimamod/mod:/mods:ro

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zimamod-proxy
  author: metisro
  developer: metisro
  category: Utilities
  icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
  index: /
  port_map: "8088"
  scheme: http
  store_app_id: zimamod
  title:
    en_us: ZimaMOD
  tagline:
    en_us: Independent mod framework for ZimaOS
  description:
    en_us: Extend the ZimaOS dashboard with independently installed JavaScript and CSS mods.
  version: "1.1.33"
  updateAt: "2026-06-21"
  releaseNotes:
    en_us: '### New: Dashboard Themes MOD  This release adds **Dashboard Themes**, a new built-for-ZimaMOD visual manager for the ZimaOS dashboard.    Dashboard Themes can style native dashboard surfaces including:    - App cards inside the ZimaOS `wujie-app` shadow root  - Native dashboard widgets  - Search bar blur surfaces  - Dashboard header surfaces    A new **DTM Settings** button is available in the MOD Store sidebar. The button only launches the manager; Dashboard Themes remains an independent MOD.    ### Dashboard Theme Options    Dashboard Themes includes:    - **Sanded Glass**  - **Liquid Glass**  - **Aero**  - **CasaOS**  - **Chaos**    Each theme now lives in its own CSS file under `mods/dashboard-themes/themes/`.    ### Weather Widget Updates    - Added **Sanded Glass** as a Weather Widget theme.  - Sanded Glass replaces the old brushed-glass direction with the new name.  - Improved the Weather Widget theme selector so longer theme names such as Liquid Glass and Sanded Glass display cleanly.    ### Documentation And Tests    - Updated root and MOD documentation to include Dashboard Themes.  - Added deployment test coverage for Dashboard Themes, theme asset paths, DTM Settings, and Weather Widget Sanded Glass.  - Verified full test suite: 10/10 passing.'
  repo: https://github.com/metisro/ZimaMOD
  support: https://github.com/metisro/ZimaMOD/issues
