name: zimamod
version: "1.1.35"

services:
  zimamod-api:
    image: ghcr.io/metisro/zimamod-api:1.1.35
    container_name: zimamod-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      BING_GALLERY_DIR: /gallery
      HOST_PROC_DIR: /host/proc
      HOST_SYS_DIR: /host/sys
      ZIMAMOD_API_PORT: "8090"
    volumes:
      - type: bind
        source: /DATA/AppData/zimamod
        target: /data
      - type: bind
        source: /DATA/Gallery/Bing Wallpapers
        target: /gallery
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true

  zimamod-proxy:
    image: ghcr.io/metisro/zimamod-proxy:1.1.35
    container_name: zimamod-proxy
    labels:
      icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zimamod-api
    environment:
      ZIMAMOD_DASHBOARD_PORT: "8088"
      ZIMAMOD_API_PORT: "8090"
    volumes:
      - type: bind
        source: /DATA/AppData/zimamod/mod
        target: /mods
        read_only: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zimamod-proxy
  author: metisro
  developer: metisro
  category: Utilities
  icon: https://raw.githubusercontent.com/metisro/ZimaMOD/main/assets/zimamod-icon.png
  index: /
  port_map: "8088"
  scheme: http
  store_app_id: zimamod
  title:
    en_us: ZimaMOD
  tagline:
    en_us: Independent mod framework for ZimaOS
  description:
    en_us: Extend the ZimaOS dashboard with independently installed JavaScript and CSS mods.
  version: "1.1.35"
  updateAt: "2026-06-25"
  releaseNotes:
    en_us: 'This release adds the new Resource Alerts MOD, a built-for-ZimaMOD monitoring widget with API-side alerting + widgets mods visual fixes       ### Added   - New Resource Alerts dashboard widget.   - Status, Events, Notes, and Settings tabs.   - CPU, RAM, disk, temperature, network, uptime, reboot, process, and storage-health views.   - API-side HTTP, TCP, and process-name service checks.   - Event history with pagination and confirmed clear-all action.   - Telegram and Gotify alert delivery from `zimamod-api`, so alerts work even when the dashboard is closed.   - Theme selector with Sanded Glass, Liquid Glass, Aero, CasaOS, and Chaos themes.   - Host `/proc` and `/sys` read-only compose mounts for accurate host metrics.    ### Fixed   - Widget Sortable now handles hidden native widgets more reliably.   - Weather Widget dashboard-column detection works when only Widget Settings remains visible.    ### Verified   - Telegram alerts tested successfully with service-down, CPU warning, and storage warning events.   - `node --check mods/resource-alerts/mod.js`   - `node --test api/deployment.test.js`   - `node --test api/server.test.js`'
  repo: https://github.com/metisro/ZimaMOD
  support: https://github.com/metisro/ZimaMOD/issues
